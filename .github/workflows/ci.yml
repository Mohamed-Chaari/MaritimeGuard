name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          pip install ruff dbt-clickhouse
          pip install -r serving/api/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: dbt parse (validate models compile)
        working-directory: warehouse/dbt
        run: dbt parse --profiles-dir .

      # dbt build + tests run against an ephemeral warehouse in a later job
      # once the star schema models are in place.
